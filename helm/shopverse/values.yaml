# ──────────────────────────────────────
# Frontend
# ──────────────────────────────────────
frontend:
  deploymentName: shopverse-frontend
  replicas: 2
  image: ""  # frontend-image
  serviceName: shopverse-frontend-svc
  servicePort: 80
  ingressName: shopverse-frontend-ingress
  ingressHost: ""

# ──────────────────────────────────────
# Backend
# ──────────────────────────────────────
backend:
  deploymentName: shopverse-backend
  replicas: 2
  image: ""  # backend-image
  serviceName: shopverse-backend-svc
  servicePort: 8080
  ingressName: shopverse-backend-ingress
  ingressHost: ""

# ──────────────────────────────────────
# Postgres (AWS RDS — db.t3.micro)
# No StatefulSet/PVC anymore: this just points the
# app at the externally-provisioned RDS instance.
# host/port are normally injected at deploy time via
# --set from the Terraform outputs (db_address/db_port).
# ──────────────────────────────────────
postgres:
  host: ""          # RDS endpoint, e.g. shopverse-postgres.xxxx.us-east-1.rds.amazonaws.com
  port: "5432"
  database: shopverse
  user: shopverse
  password: ""       # injected via --set-string at deploy time, never committed
  sslmode: require

# ──────────────────────────────────────
# Shared
# ──────────────────────────────────────
ingress:
  enabled: false
  ingressClassName: traefik
  annotations: {}

jwtSecret: ""
