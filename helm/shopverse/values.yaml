# ──────────────────────────────────────
# Frontend
# ──────────────────────────────────────
frontend:
  deploymentName: shopverse-frontend
  replicas: 2
  image: ""  # frontend-image
  serviceName: shopverse-frontend-svc
  servicePort: 80
  ingressName: shopverse-frontend-ingress
  ingressHost: ""

# ──────────────────────────────────────
# Backend
# ──────────────────────────────────────
backend:
  deploymentName: shopverse-backend
  replicas: 2
  image: ""  # backend-image
  serviceName: shopverse-backend-svc
  servicePort: 8080
  ingressName: shopverse-backend-ingress
  ingressHost: ""
  # IAM role ARN for IRSA (terraform output: backend_irsa_role_arn)
  irsaRoleArn: ""

# ──────────────────────────────────────
# RDS (Postgres) - connection details are fetched from
# Secrets Manager by the backend pod itself; Helm only
# needs to pass through the secret ARN and AWS region.
# ──────────────────────────────────────
rds:
  secretArn: ""  # terraform output: rds_secret_arn

aws:
  region: ""  # e.g. us-east-1

# ──────────────────────────────────────
# Shared
# ──────────────────────────────────────
ingress:
  enabled: false
  ingressClassName: traefik
  annotations: {}

jwtSecret: ""
