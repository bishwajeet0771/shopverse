# ──────────────────────────────────────
# Frontend
# ──────────────────────────────────────
frontend:
  deploymentName: shopverse-frontend
  replicas: 2
  image: ""  # frontend-image
  serviceName: shopverse-frontend-svc
  servicePort: 80
  ingressName: shopverse-frontend-ingress
  ingressHost: ""


# ──────────────────────────────────────
# Backend
# ──────────────────────────────────────
backend:
  deploymentName: shopverse-backend
  replicas: 2
  image: ""  # backend-image
  serviceName: shopverse-backend-svc
  servicePort: 8080
  ingressName: shopverse-backend-ingress
  ingressHost: ""

  # Kubernetes ServiceAccount used by the backend pod.
  #
  # This ServiceAccount must be connected to an AWS IAM role
  # that has permission to read the PostgreSQL secret from
  # AWS Secrets Manager.
  serviceAccountName: shopverse-backend

  # AWS Secrets Manager secret containing the RDS PostgreSQL
  # connection information.
  dbSecretName: Latest-Prod-ShopVerse-Postgres-Credentials
  databaseName: shopverse


# ──────────────────────────────────────
# Shared
# ──────────────────────────────────────
ingress:
  enabled: false
  ingressClassName: traefik
  annotations: {}


# ──────────────────────────────────────
# JWT
# ──────────────────────────────────────
#
# Keep this empty in values.yaml.
# Supply the actual JWT secret during Helm deployment.
#
jwtSecret: ""
