apiVersion: v1
kind: Secret
metadata:
  name: shopverse-secret
  labels:
    app: shopverse
type: Opaque
data:
  # DB credentials are no longer stored here - the backend pod fetches them
  # directly from AWS Secrets Manager at startup via IRSA (see
  # serviceaccount.yaml and values.yaml `rds.secretArn` / `backend.irsaRoleArn`).
  JWT_SECRET: {{ .Values.jwtSecret | b64enc | quote }}
