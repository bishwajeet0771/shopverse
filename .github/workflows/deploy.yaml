name: ShopVerse CI/CD

on:
  push:
    branches: [dev]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  HELM_CHART_NAME: shopverse
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

jobs:

  # ============================================================
  # Stage 1: Test
  # ============================================================
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Go
      # ----------------------------------------------------------
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run Go tests
        working-directory: ./backend
        run: |
          go test ./...

      # ----------------------------------------------------------
      # Frontend
      # ----------------------------------------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: ./frontend
        run: |
          npx eslint . \
            --ext js,jsx \
            --report-unused-disable-directives \
            --max-warnings 0 \
            --config .eslintrc.cjs


  # ============================================================
  # Stage 2: Security Scan
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: backend/go.sum

      # ----------------------------------------------------------
      # Build images
      # ----------------------------------------------------------

      - name: Build frontend image
        run: |
          docker build \
            -t shopverse-frontend:scan \
            ./frontend

      - name: Build backend image
        run: |
          docker build \
            -t shopverse-backend:scan \
            ./backend

      # ----------------------------------------------------------
      # Install Trivy
      # ----------------------------------------------------------

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update -q
          sudo apt-get install -y trivy

      # ----------------------------------------------------------
      # Trivy frontend
      # ----------------------------------------------------------

      - name: Run Trivy scan on frontend
        run: |
          trivy image \
            --exit-code 1 \
            --severity CRITICAL \
            --ignore-unfixed \
            --format table \
            shopverse-frontend:scan

      # ----------------------------------------------------------
      # Trivy backend
      # ----------------------------------------------------------

      - name: Run Trivy scan on backend
        run: |
          trivy image \
            --exit-code 1 \
            --severity CRITICAL \
            --ignore-unfixed \
            --format table \
            shopverse-backend:scan


  # ============================================================
  # Stage 3: Build, Tag & Push Images + Helm Chart
  # ============================================================
  build-and-push:
    name: Build, Tag & Push
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # AWS
      # ----------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # ECR
      # ----------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repositories exist
        run: |
          for repo in shopverse-frontend shopverse-backend shopverse-helmchart/shopverse; do

            if aws ecr describe-repositories \
              --repository-names "$repo" \
              --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then

              echo "ECR repository already exists: $repo"

            else

              echo "Creating ECR repository: $repo"

              aws ecr create-repository \
                --repository-name "$repo" \
                --region "${{ env.AWS_REGION }}"

            fi

          done

      # ----------------------------------------------------------
      # Build frontend
      # ----------------------------------------------------------

      - name: Build and tag frontend image
        run: |
          docker build \
            -t ${{ env.ECR_REGISTRY }}/shopverse-frontend:${{ github.sha }} \
            -t ${{ env.ECR_REGISTRY }}/shopverse-frontend:latest \
            ./frontend

      # ----------------------------------------------------------
      # Build backend
      # ----------------------------------------------------------

      - name: Build and tag backend image
        run: |
          docker build \
            -t ${{ env.ECR_REGISTRY }}/shopverse-backend:${{ github.sha }} \
            -t ${{ env.ECR_REGISTRY }}/shopverse-backend:latest \
            ./backend

      # ----------------------------------------------------------
      # Push frontend
      # ----------------------------------------------------------

      - name: Push frontend image
        run: |
          docker push \
            ${{ env.ECR_REGISTRY }}/shopverse-frontend:${{ github.sha }}

          docker push \
            ${{ env.ECR_REGISTRY }}/shopverse-frontend:latest

      # ----------------------------------------------------------
      # Push backend
      # ----------------------------------------------------------

      - name: Push backend image
        run: |
          docker push \
            ${{ env.ECR_REGISTRY }}/shopverse-backend:${{ github.sha }}

          docker push \
            ${{ env.ECR_REGISTRY }}/shopverse-backend:latest

      # ----------------------------------------------------------
      # Helm
      # ----------------------------------------------------------

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Login Helm to ECR
        run: |
          aws ecr get-login-password \
            --region "${{ env.AWS_REGION }}" | \
          helm registry login \
            --username AWS \
            --password-stdin \
            "${{ env.ECR_REGISTRY }}"

      - name: Validate Helm chart
        run: |
          helm lint ./helm/shopverse

      - name: Package Helm chart
        run: |
          helm package ./helm/shopverse \
            --version 1.0.0-${{ github.sha }} \
            --app-version ${{ github.sha }}

      - name: Push Helm chart to ECR
        run: |
          helm push \
            shopverse-1.0.0-${{ github.sha }}.tgz \
            oci://${{ env.ECR_REGISTRY }}/shopverse-helmchart


  # ============================================================
  # Stage 4: Provision Infrastructure + Deploy
  # ============================================================
  deploy:
    name: Provision Infra & Deploy
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # AWS
      # ----------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ==========================================================
      # Check EKS
      # ==========================================================

      - name: Check if EKS cluster exists
        id: check-cluster
        run: |
          if aws eks describe-cluster \
            --name "${{ env.EKS_CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then

            echo "cluster_exists=true" >> "$GITHUB_OUTPUT"

            echo "EKS cluster '${{ env.EKS_CLUSTER_NAME }}' found."

          else

            echo "cluster_exists=false" >> "$GITHUB_OUTPUT"

            echo "EKS cluster '${{ env.EKS_CLUSTER_NAME }}' NOT found."

          fi

      # ==========================================================
      # Terraform — now runs on every deploy, not just first creation.
      # This is required so RDS (and any other infra change) stays in
      # sync, and so its endpoint can be read via `terraform output`
      # every run. `terraform apply` is idempotent: no-op if nothing
      # changed.
      # ==========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        working-directory: ./terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=eks/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Plan
        working-directory: ./terraform
        run: |
          terraform plan \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="cluster_name=${{ env.EKS_CLUSTER_NAME }}" \
            -var="project_name=shopverse" \
            -var="create_jump_server=false" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        run: |
          terraform apply \
            -auto-approve \
            tfplan

      - name: Read RDS endpoint from Terraform outputs
        id: rds
        working-directory: ./terraform
        run: |
          echo "host=$(terraform output -raw db_address)" >> "$GITHUB_OUTPUT"
          echo "port=$(terraform output -raw db_port)" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # Wait for EKS
      # ==========================================================

      - name: Wait for EKS cluster to be active
        if: steps.check-cluster.outputs.cluster_exists == 'false'
        run: |
          echo "Waiting for EKS cluster..."

          aws eks wait cluster-active \
            --name "${{ env.EKS_CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}"

          echo "Waiting for node group..."

          aws eks wait nodegroup-active \
            --cluster-name "${{ env.EKS_CLUSTER_NAME }}" \
            --nodegroup-name "${{ env.EKS_CLUSTER_NAME }}-nodes" \
            --region "${{ env.AWS_REGION }}"

          echo "Cluster and nodes are ready."

      # ==========================================================
      # Install/upgrade AWS Load Balancer Controller
      # (idempotent now — runs every deploy, not just first creation)
      # ==========================================================

      - name: Install/upgrade AWS Load Balancer Controller
        run: |

          aws eks update-kubeconfig \
            --name "${{ env.EKS_CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}"

          helm repo add eks https://aws.github.io/eks-charts
          helm repo update

          ALB_ROLE_ARN=$(cd terraform && terraform output -raw alb_controller_role_arn)

          echo "ALB Controller IAM role:"
          echo "$ALB_ROLE_ARN"

          helm upgrade --install aws-load-balancer-controller \
            eks/aws-load-balancer-controller \
            --namespace kube-system \
            --set clusterName="${{ env.EKS_CLUSTER_NAME }}" \
            --set serviceAccount.create=true \
            --set serviceAccount.name=aws-load-balancer-controller \
            --set serviceAccount.annotations."eks\.amazonaws\.com/role-arn"="$ALB_ROLE_ARN" \
            --wait \
            --timeout 300s

      # ==========================================================
      # kubectl / Helm
      # ==========================================================

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "${{ env.EKS_CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}"

      # ==========================================================
      # Verify Kubernetes connection
      # ==========================================================

      - name: Verify EKS connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      # ==========================================================
      # Get ShopVerse backend IAM role
      # ==========================================================

      - name: Get backend IAM role ARN
        run: |

          ROLE_NAME="${{ env.EKS_CLUSTER_NAME }}-shopverse-backend"

          echo "Looking for IAM role:"
          echo "$ROLE_NAME"

          BACKEND_ROLE_ARN=$(aws iam get-role \
            --role-name "$ROLE_NAME" \
            --query 'Role.Arn' \
            --output text)

          if [ -z "$BACKEND_ROLE_ARN" ] || [ "$BACKEND_ROLE_ARN" = "None" ]; then
            echo "ERROR: Backend IAM role was not found."
            exit 1
          fi

          echo "Backend IAM role ARN:"
          echo "$BACKEND_ROLE_ARN"

          echo "BACKEND_ROLE_ARN=$BACKEND_ROLE_ARN" >> "$GITHUB_ENV"

      # ==========================================================
      # Login to ECR for Helm
      # ==========================================================

      - name: Login to ECR for Helm
        run: |
          aws ecr get-login-password \
            --region "${{ env.AWS_REGION }}" | \
          helm registry login \
            --username AWS \
            --password-stdin \
            "${{ env.ECR_REGISTRY }}"

      # ==========================================================
      # Deploy ShopVerse
      # ==========================================================

      - name: Deploy Helm chart
        run: |

          echo "Deploying ShopVerse..."

          echo "Backend IAM role:"
          echo "$BACKEND_ROLE_ARN"

          echo "RDS endpoint:"
          echo "${{ steps.rds.outputs.host }}:${{ steps.rds.outputs.port }}"

          helm upgrade --install shopverse \
            oci://${{ env.ECR_REGISTRY }}/shopverse-helmchart/shopverse \
            --version 1.0.0-${{ github.sha }} \
            --set frontend.image=${{ env.ECR_REGISTRY }}/shopverse-frontend:${{ github.sha }} \
            --set backend.image=${{ env.ECR_REGISTRY }}/shopverse-backend:${{ github.sha }} \
            --set backend.iamRoleArn="$BACKEND_ROLE_ARN" \
            --set postgres.host="${{ steps.rds.outputs.host }}" \
            --set postgres.port="${{ steps.rds.outputs.port }}" \
            --set-string postgres.password="${{ secrets.DB_PASSWORD }}" \
            --set jwtSecret="${{ secrets.JWT_SECRET }}" \
            --namespace shopverse \
            --create-namespace \
            --wait \
            --timeout 300s \
            --cleanup-on-fail

      # ==========================================================
      # Verify deployment
      # ==========================================================

      - name: Verify deployment
        run: |

          echo ""
          echo "========================================"
          echo "           Kubernetes Nodes"
          echo "========================================"
          kubectl get nodes -o wide

          echo ""
          echo "========================================"
          echo "           Service Accounts"
          echo "========================================"
          kubectl get serviceaccount \
            -n shopverse

          echo ""
          echo "========================================"
          echo "           Backend ServiceAccount"
          echo "========================================"
          kubectl describe serviceaccount \
            shopverse-backend \
            -n shopverse

          echo ""
          echo "========================================"
          echo "           Pods"
          echo "========================================"
          kubectl get pods \
            -n shopverse \
            -o wide

          echo ""
          echo "========================================"
          echo "           Deployments"
          echo "========================================"
          kubectl get deployments \
            -n shopverse

          echo ""
          echo "========================================"
          echo "           Services"
          echo "========================================"
          kubectl get svc \
            -n shopverse

          echo ""
          echo "========================================"
          echo "           RDS Instance Status"
          echo "========================================"
          aws rds describe-db-instances \
            --db-instance-identifier shopverse-postgres \
            --region "${{ env.AWS_REGION }}" \
            --query 'DBInstances[0].[DBInstanceStatus,Endpoint.Address,Endpoint.Port]' \
            --output table

          echo ""
          echo "========================================"
          echo "           Secrets"
          echo "========================================"
          kubectl get secrets \
            -n shopverse

          echo ""
          echo "========================================"
          echo "           Ingress"
          echo "========================================"
          kubectl get ingress \
            -n shopverse \
            2>/dev/null || echo "No ingress configured"

          echo ""
          echo "========================================"
          echo "           Backend Pods"
          echo "========================================"
          kubectl get pods \
            -n shopverse \
            -l component=backend \
            -o jsonpath='{range .items[*]}{.metadata.name}{" -> "}{.status.phase}{"\n"}{end}'

          echo ""
          echo "Deployment verification complete."
