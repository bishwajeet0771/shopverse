name: ShopVerse CI/CD

on:
  push:
    branches: [dev]

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  HELM_CHART_NAME: shopverse
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}

jobs:

  # ============================================================
  # Stage 1: Test
  # ============================================================
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Go
      # ----------------------------------------------------------

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        run: |
          go version

      - name: Download Go dependencies
        working-directory: ./backend
        run: |
          go mod download

      - name: Verify pgx version
        working-directory: ./backend
        run: |
          echo "Checking pgx version..."
          PGX_VERSION=$(go list -m -f '{{.Version}}' github.com/jackc/pgx/v5)

          echo "Resolved pgx version: $PGX_VERSION"

          if [ "$PGX_VERSION" != "v5.9.0" ]; then
            echo "ERROR: Expected pgx v5.9.0"
            echo "Found: $PGX_VERSION"
            exit 1
          fi

          echo "pgx version is secure: $PGX_VERSION"

      - name: Verify Go modules
        working-directory: ./backend
        run: |
          go mod verify

      - name: Run Go tests
        working-directory: ./backend
        run: |
          go test ./...

      # ----------------------------------------------------------
      # Frontend
      # ----------------------------------------------------------

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Run frontend lint
        working-directory: ./frontend
        run: |
          npx eslint . \
            --ext js,jsx \
            --report-unused-disable-directives \
            --max-warnings 0 \
            --config .eslintrc.cjs


  # ============================================================
  # Stage 2: Security Scan
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Go
      # ----------------------------------------------------------

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        run: |
          go version

      - name: Download Go dependencies
        working-directory: ./backend
        run: |
          go mod download

      - name: Verify pgx version
        working-directory: ./backend
        run: |
          echo "Checking pgx version..."

          PGX_VERSION=$(go list -m -f '{{.Version}}' github.com/jackc/pgx/v5)

          echo "Resolved pgx version: $PGX_VERSION"

          if [ "$PGX_VERSION" != "v5.9.0" ]; then
            echo "ERROR: Expected pgx v5.9.0"
            echo "Found: $PGX_VERSION"
            exit 1
          fi

          echo "pgx version is secure: $PGX_VERSION"

      # ----------------------------------------------------------
      # Build images
      # ----------------------------------------------------------

      - name: Build frontend image
        run: |
          docker build \
            -t shopverse-frontend:scan \
            ./frontend

      - name: Build backend image
        run: |
          docker build \
            -t shopverse-backend:scan \
            ./backend

      # ----------------------------------------------------------
      # Install Trivy
      # ----------------------------------------------------------

      - name: Install Trivy
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            wget \
            apt-transport-https \
            gnupg

          wget -qO - \
            https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update -q

          sudo apt-get install -y trivy

          trivy --version

      # ----------------------------------------------------------
      # Trivy frontend
      # ----------------------------------------------------------

      - name: Run Trivy scan on frontend
        run: |
          trivy image \
            --exit-code 1 \
            --severity CRITICAL \
            --ignore-unfixed \
            --format table \
            shopverse-frontend:scan

      # ----------------------------------------------------------
      # Trivy backend
      # ----------------------------------------------------------

      - name: Run Trivy scan on backend
        run: |
          trivy image \
            --exit-code 1 \
            --severity CRITICAL \
            --ignore-unfixed \
            --format table \
            shopverse-backend:scan


  # ============================================================
  # Stage 3: Build, Tag & Push Images + Helm Chart
  # ============================================================
  build-and-push:
    name: Build, Tag & Push
    runs-on: ubuntu-latest
    needs: security-scan

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # AWS
      # ----------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------------------------
      # Go
      # ----------------------------------------------------------

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        run: |
          go version

      - name: Verify pgx version
        working-directory: ./backend
        run: |
          PGX_VERSION=$(go list -m -f '{{.Version}}' github.com/jackc/pgx/v5)

          echo "pgx version: $PGX_VERSION"

          if [ "$PGX_VERSION" != "v5.9.0" ]; then
            echo "ERROR: Expected pgx v5.9.0"
            exit 1
          fi

      # ----------------------------------------------------------
      # ECR
      # ----------------------------------------------------------

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repositories exist
        run: |
          for repo in \
            shopverse-frontend \
            shopverse-backend \
            shopverse-helmchart/shopverse
          do

            if aws ecr describe-repositories \
              --repository-names "$repo" \
              --region "${{ env.AWS_REGION }}" \
              >/dev/null 2>&1
            then

              echo "ECR repository already exists: $repo"

            else

              echo "Creating ECR repository: $repo"

              aws ecr create-repository \
                --repository-name "$repo" \
                --region "${{ env.AWS_REGION }}"

            fi

          done

      # ----------------------------------------------------------
      # Build frontend
      # ----------------------------------------------------------

      - name: Build frontend image
        run: |
          docker build \
            -t "${{ env.ECR_REGISTRY }}/shopverse-frontend:${{ github.sha }}" \
            -t "${{ env.ECR_REGISTRY }}/shopverse-frontend:latest" \
            ./frontend

      # ----------------------------------------------------------
      # Build backend
      # ----------------------------------------------------------

      - name: Build backend image
        run: |
          docker build \
            -t "${{ env.ECR_REGISTRY }}/shopverse-backend:${{ github.sha }}" \
            -t "${{ env.ECR_REGISTRY }}/shopverse-backend:latest" \
            ./backend

      # ----------------------------------------------------------
      # Push frontend
      # ----------------------------------------------------------

      - name: Push frontend image
        run: |
          docker push \
            "${{ env.ECR_REGISTRY }}/shopverse-frontend:${{ github.sha }}"

          docker push \
            "${{ env.ECR_REGISTRY }}/shopverse-frontend:latest"

      # ----------------------------------------------------------
      # Push backend
      # ----------------------------------------------------------

      - name: Push backend image
        run: |
          docker push \
            "${{ env.ECR_REGISTRY }}/shopverse-backend:${{ github.sha }}"

          docker push \
            "${{ env.ECR_REGISTRY }}/shopverse-backend:latest"

      # ----------------------------------------------------------
      # Helm
      # ----------------------------------------------------------

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Login Helm to ECR
        run: |
          aws ecr get-login-password \
            --region "${{ env.AWS_REGION }}" | \
          helm registry login \
            --username AWS \
            --password-stdin \
            "${{ env.ECR_REGISTRY }}"

      - name: Validate Helm chart
        run: |
          helm lint ./helm/shopverse

      - name: Package Helm chart
        run: |
          helm package ./helm/shopverse \
            --version "1.0.0-${{ github.sha }}" \
            --app-version "${{ github.sha }}"

      - name: Push Helm chart to ECR
        run: |
          helm push \
            "shopverse-1.0.0-${{ github.sha }}.tgz" \
            "oci://${{ env.ECR_REGISTRY }}/shopverse-helmchart"


  # ============================================================
  # Stage 4: Provision Infrastructure + Deploy
  # ============================================================
  deploy:
    name: Provision Infra & Deploy
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # AWS
      # ----------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ==========================================================
      # Check EKS
      # ==========================================================

      - name: Check if EKS cluster exists
        id: check-cluster
        shell: bash
        run: |

          if aws eks describe-cluster \
            --name "${{ env.EKS_CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}" \
            >/dev/null 2>&1
          then

            echo "cluster_exists=true" >> "$GITHUB_OUTPUT"

            echo "EKS cluster exists."

          else

            echo "cluster_exists=false" >> "$GITHUB_OUTPUT"

            echo "EKS cluster does not exist."

          fi


      # ==========================================================
      # Terraform
      # ==========================================================

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        working-directory: ./terraform
        run: |

          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=eks/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"


      - name: Terraform Plan
        if: steps.check-cluster.outputs.cluster_exists == 'false'
        working-directory: ./terraform
        run: |

          terraform plan \
            -var="aws_region=${{ env.AWS_REGION }}" \
            -var="cluster_name=${{ env.EKS_CLUSTER_NAME }}" \
            -var="project_name=shopverse" \
            -var="create_jump_server=false" \
            -out=tfplan


      - name: Terraform Apply
        if: steps.check-cluster.outputs.cluster_exists == 'false'
        working-directory: ./terraform
        run: |

          terraform apply \
            -auto-approve \
            tfplan


      # ==========================================================
      # Wait for EKS
      # ==========================================================

      - name: Wait for EKS cluster to be active
        if: steps.check-cluster.outputs.cluster_exists == 'false'
        run: |

          echo "Waiting for EKS cluster..."

          aws eks wait cluster-active \
            --name "${{ env.EKS_CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}"

          echo "Waiting for node group..."

          aws eks wait nodegroup-active \
            --cluster-name "${{ env.EKS_CLUSTER_NAME }}" \
            --nodegroup-name "${{ env.EKS_CLUSTER_NAME }}-nodes" \
            --region "${{ env.AWS_REGION }}"

          echo "EKS cluster and nodes are ready."


      # ==========================================================
      # kubectl / Helm
      # ==========================================================

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4


      # ==========================================================
      # Update kubeconfig
      # ==========================================================

      - name: Update kubeconfig
        run: |

          aws eks update-kubeconfig \
            --name "${{ env.EKS_CLUSTER_NAME }}" \
            --region "${{ env.AWS_REGION }}"


      # ==========================================================
      # Verify Kubernetes
      # ==========================================================

      - name: Verify EKS connection
        run: |

          kubectl cluster-info

          echo ""

          kubectl get nodes


      # ==========================================================
      # AWS Load Balancer Controller
      # ==========================================================

      - name: Install / Upgrade AWS Load Balancer Controller
        run: |

          helm repo add eks \
            https://aws.github.io/eks-charts

          helm repo update

          echo "Checking AWS Load Balancer Controller..."

          if helm status \
            aws-load-balancer-controller \
            --namespace kube-system \
            >/dev/null 2>&1
          then

            echo "AWS Load Balancer Controller already installed."

          else

            echo "AWS Load Balancer Controller is not installed."

            ALB_ROLE_ARN=""

            # ----------------------------------------------------
            # Try Terraform output first.
            # ----------------------------------------------------

            if terraform -chdir=terraform output \
              -raw alb_controller_role_arn \
              >/dev/null 2>&1
            then

              ALB_ROLE_ARN=$(terraform \
                -chdir=terraform \
                output -raw alb_controller_role_arn)

            fi

            # ----------------------------------------------------
            # Validate role.
            # ----------------------------------------------------

            if [ -z "$ALB_ROLE_ARN" ]; then

              echo "ERROR: Could not determine ALB controller IAM role ARN."

              echo "Make sure Terraform provides:"
              echo "alb_controller_role_arn"

              exit 1

            fi

            echo "ALB Controller IAM role:"
            echo "$ALB_ROLE_ARN"

            helm upgrade --install \
              aws-load-balancer-controller \
              eks/aws-load-balancer-controller \
              --namespace kube-system \
              --create-namespace \
              --set "clusterName=${{ env.EKS_CLUSTER_NAME }}" \
              --set "serviceAccount.create=true" \
              --set "serviceAccount.name=aws-load-balancer-controller" \
              --set "serviceAccount.annotations.eks\.amazonaws\.com/role-arn=${ALB_ROLE_ARN}" \
              --wait \
              --timeout 300s

          fi


      # ==========================================================
      # Get ShopVerse backend IAM role
      # ==========================================================

      - name: Get backend IAM role ARN
        id: backend-role
        shell: bash
        run: |

          echo "Searching for ShopVerse backend IAM role..."

          BACKEND_ROLE_ARN=""

          # ------------------------------------------------------
          # Try Terraform output.
          # ------------------------------------------------------

          echo "Trying Terraform output..."

          BACKEND_ROLE_ARN=$(terraform \
            -chdir=terraform \
            output -raw shopverse_backend_role_arn \
            2>/dev/null || true)

          # ------------------------------------------------------
          # If output unavailable, try alternative output name.
          # ------------------------------------------------------

          if [ -z "$BACKEND_ROLE_ARN" ]; then

            echo "Trying backend_role_arn..."

            BACKEND_ROLE_ARN=$(terraform \
              -chdir=terraform \
              output -raw backend_role_arn \
              2>/dev/null || true)

          fi

          # ------------------------------------------------------
          # If Terraform output unavailable, search IAM.
          # ------------------------------------------------------

          if [ -z "$BACKEND_ROLE_ARN" ]; then

            ROLE_NAME="${{ env.EKS_CLUSTER_NAME }}-shopverse-backend"

            echo "Trying IAM role:"
            echo "$ROLE_NAME"

            BACKEND_ROLE_ARN=$(aws iam get-role \
              --role-name "$ROLE_NAME" \
              --query 'Role.Arn' \
              --output text \
              2>/dev/null || true)

          fi

          # ------------------------------------------------------
          # Validate.
          # ------------------------------------------------------

          if [ -z "$BACKEND_ROLE_ARN" ] || \
             [ "$BACKEND_ROLE_ARN" = "None" ]; then

            echo ""
            echo "ERROR: ShopVerse backend IAM role was not found."
            echo ""
            echo "The Terraform configuration must create an IAM role"
            echo "for the Kubernetes ServiceAccount:"
            echo ""
            echo "shopverse-backend"
            echo ""
            echo "and provide Terraform output:"
            echo ""
            echo "shopverse_backend_role_arn"
            echo ""

            exit 1

          fi

          if [[ "$BACKEND_ROLE_ARN" != arn:aws:iam::*:role/* ]]; then

            echo "ERROR: Invalid IAM role ARN:"
            echo "$BACKEND_ROLE_ARN"

            exit 1

          fi

          echo "Backend IAM role:"
          echo "$BACKEND_ROLE_ARN"

          echo "BACKEND_ROLE_ARN=$BACKEND_ROLE_ARN" >> "$GITHUB_ENV"


      # ==========================================================
      # Verify backend IAM permissions
      # ==========================================================

      - name: Verify backend IAM role exists
        run: |

          echo "Verifying backend IAM role..."

          aws iam get-role \
            --role-name "${BACKEND_ROLE_ARN##*/}" \
            --query 'Role.[RoleName,Arn]' \
            --output table

          echo ""
          echo "Backend IAM role verified."


      # ==========================================================
      # Login Helm to ECR
      # ==========================================================

      - name: Login to ECR for Helm
        run: |

          aws ecr get-login-password \
            --region "${{ env.AWS_REGION }}" | \
          helm registry login \
            --username AWS \
            --password-stdin \
            "${{ env.ECR_REGISTRY }}"


      # ==========================================================
      # Verify Helm chart
      # ==========================================================

      - name: Verify Helm chart
        run: |

          echo "Checking Helm chart..."

          helm show chart \
            "oci://${{ env.ECR_REGISTRY }}/shopverse-helmchart/shopverse" \
            --version "1.0.0-${{ github.sha }}"


      # ==========================================================
      # Deploy ShopVerse
      # ==========================================================

      - name: Deploy Helm chart
        shell: bash
        run: |

          echo "=========================================="
          echo "Deploying ShopVerse"
          echo "=========================================="

          echo "ECR Registry:"
          echo "${{ env.ECR_REGISTRY }}"

          echo "Chart:"
          echo "shopverse"

          echo "Chart Version:"
          echo "1.0.0-${{ github.sha }}"

          echo "Backend ServiceAccount:"
          echo "shopverse-backend"

          echo "Backend IAM Role:"
          echo "$BACKEND_ROLE_ARN"

          echo "=========================================="

          helm upgrade --install \
            shopverse \
            "oci://${{ env.ECR_REGISTRY }}/shopverse-helmchart/shopverse" \
            --version "1.0.0-${{ github.sha }}" \
            --set "frontend.image=${{ env.ECR_REGISTRY }}/shopverse-frontend:${{ github.sha }}" \
            --set "backend.image=${{ env.ECR_REGISTRY }}/shopverse-backend:${{ github.sha }}" \
            --set "backend.iamRoleArn=${BACKEND_ROLE_ARN}" \
            --set "backend.serviceAccountName=shopverse-backend" \
            --set "backend.dbSecretName=Latest-Prod-ShopVerse-Postgres-Credentials" \
            --set "jwtSecret=${{ secrets.JWT_SECRET }}" \
            --namespace shopverse \
            --create-namespace \
            --wait \
            --timeout 300s \
            --cleanup-on-fail


      # ==========================================================
      # Verify Deployment
      # ==========================================================

      - name: Verify deployment
        shell: bash
        run: |

          echo ""
          echo "=========================================="
          echo "Kubernetes Nodes"
          echo "=========================================="

          kubectl get nodes -o wide


          echo ""
          echo "=========================================="
          echo "Service Accounts"
          echo "=========================================="

          kubectl get serviceaccount \
            -n shopverse


          echo ""
          echo "=========================================="
          echo "ShopVerse Backend ServiceAccount"
          echo "=========================================="

          kubectl get serviceaccount \
            shopverse-backend \
            -n shopverse \
            -o yaml


          echo ""
          echo "=========================================="
          echo "Backend Deployment"
          echo "=========================================="

          kubectl get deployment \
            shopverse-backend \
            -n shopverse \
            -o wide


          echo ""
          echo "=========================================="
          echo "Backend Pods"
          echo "=========================================="

          kubectl get pods \
            -n shopverse \
            -l component=backend \
            -o wide


          echo ""
          echo "=========================================="
          echo "All Pods"
          echo "=========================================="

          kubectl get pods \
            -n shopverse \
            -o wide


          echo ""
          echo "=========================================="
          echo "Services"
          echo "=========================================="

          kubectl get svc \
            -n shopverse


          echo ""
          echo "=========================================="
          echo "StatefulSets"
          echo "=========================================="

          kubectl get sts \
            -n shopverse


          echo ""
          echo "=========================================="
          echo "PV / PVC"
          echo "=========================================="

          kubectl get pv,pvc \
            -n shopverse


          echo ""
          echo "=========================================="
          echo "Secrets"
          echo "=========================================="

          kubectl get secrets \
            -n shopverse


          echo ""
          echo "=========================================="
          echo "Ingress"
          echo "=========================================="

          kubectl get ingress \
            -n shopverse \
            2>/dev/null || echo "No ingress configured"


          echo ""
          echo "=========================================="
          echo "Backend Pod Status"
          echo "=========================================="

          kubectl get pods \
            -n shopverse \
            -l component=backend \
            -o jsonpath='{range .items[*]}{.metadata.name}{" -> "}{.status.phase}{"\n"}{end}'


          echo ""
          echo "=========================================="
          echo "ShopVerse deployment verification complete"
          echo "=========================================="
