version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: shopverse-postgres
    environment:
      POSTGRES_DB: shopverse
      POSTGRES_USER: shopverse
      POSTGRES_PASSWORD: shopverse123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopverse -d shopverse"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: shopverse-backend
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: shopverse
      DB_USER: shopverse
      DB_PASSWORD: shopverse123
      DB_SSLMODE: disable
      JWT_SECRET: local-dev-jwt-secret-key
      FRONTEND_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    container_name: shopverse-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
